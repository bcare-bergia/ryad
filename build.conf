# ryad build settings: the built-in defaults of "ryad build" (shell syntax).
# Override them in ~/.config/ryad/build.conf, with --config=FILE, or on the
# command line (ryad build --help).

# Base image: any Debian/Ubuntu image (Ubuntu >= 22.04, Debian >= 12).
BASE_IMAGE=ubuntu:26.04

# Name of the resulting image (tagged :latest and :cc-<code>_cd-<desktop>).
IMAGE_NAME=ryad

# Third-party apps to install, from apps/<name>.sh.
# claude-desktop and claude-code are always installed.
APPS="firefox vscodium rstudio"

# Extra apt packages, on top of packages/*.list.
EXTRA_PACKAGES=""

# Versions. "latest" is resolved to a concrete version at build time, so a
# rebuild picks up new releases and only rebuilds the layers that changed.
CLAUDE_CODE_VERSION=latest       # latest | stable | X.Y.Z
CLAUDE_DESKTOP_VERSION=latest    # latest | X.Y.Z
RSTUDIO_VERSION=latest           # latest | e.g. 2026.10.0-233

# Any other <APP>_VERSION=... set here is passed to apps/<app>.sh, e.g.
# VSCODIUM_VERSION=1.105.0.25000
# FIREFOX_VERSION=latest
